<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Example QR Codes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <span class="site-title">QR Tools</span>
      <nav>
        <a href="index.html">← Scanner</a>
      </nav>
    </div>
  </header>

  <div class="page-container">
    <h1>Example QR Codes</h1>
    <div class="qr-list">
      <div class="qr-item">
        <h2>link-qr.png</h2>
        <img src="data/link-qr.png" alt="link-qr">
      </div>
      <div class="qr-item">
        <h2>link-qr-with-qs.png</h2>
        <img src="data/link-qr-with-qs.png" alt="link-qr-with-qs">
      </div>
      <div class="qr-item">
        <h2>text-qr.png</h2>
        <img src="data/text-qr.png" alt="text-qr">
      </div>
    </div>
  </div>
</body>
</html>
